# Reporting service on the VPS: the metrics API and its Postgres. Data browsing
# is done locally with `npm run db:studio` over an SSH tunnel, never from here.
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://reporting:${POSTGRES_PASSWORD}@db:5432/reporting
    ports:
      - "4000:4000"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reporting
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
