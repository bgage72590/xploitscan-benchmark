# The worker reads the same values straight from AWS Secrets Manager through
# the Secrets Store CSI driver; nothing secret is committed here, only the
# names of the entries to mount.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: worker-secrets
  namespace: production
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "prod/web/database-url"
        objectType: "secretsmanager"
      - objectName: "prod/web/stripe-secret-key"
        objectType: "secretsmanager"
