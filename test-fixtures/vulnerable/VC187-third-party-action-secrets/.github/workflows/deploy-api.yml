name: Deploy API

on:
  push:
    branches: [main]
    paths: ["api/**"]

jobs:
  deploy:
    # Shared Fly.io deploy pipeline maintained in someone else's repo. Its
    # code runs with the Fly token handed over below.
    uses: devops-templates/github-workflows/.github/workflows/fly-deploy.yml@v1
    with:
      app-name: acme-api
      working-directory: api
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  notify:
    needs: deploy
    # The same outside repo's Slack notifier takes no inputs, only the
    # webhook secret.
    uses: devops-templates/github-workflows/.github/workflows/slack-notify.yml@v1
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
