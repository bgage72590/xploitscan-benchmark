# Release workflow that hardcodes registry credentials instead of using
# ${{ secrets.* }}. This should trigger VC076 (Hardcoded Secrets in CI/CD Config).
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: "npm_FAKE00000000000000000000000000000000"
          NPM_TOKEN: "npm_FAKE00000000000000000000000000000000"
        run: npm publish --access public

      - name: Log in to the container registry
        env:
          DOCKER_USERNAME: ci-bot
          DOCKER_PASSWORD: "dckr_pat_FAKE0000000000000000000000"
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Upload build artifacts to S3
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
        run: aws s3 sync ./dist s3://releases-bucket/$GITHUB_REF_NAME
