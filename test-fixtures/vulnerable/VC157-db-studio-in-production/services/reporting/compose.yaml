# Reporting service on the VPS: the metrics API, its Postgres, and Drizzle
# Studio so the ops team can browse and fix data from anywhere.
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://reporting:${POSTGRES_PASSWORD}@db:5432/reporting
    ports:
      - "4000:4000"
    depends_on:
      - db

  studio:
    build: .
    restart: unless-stopped
    command: npx drizzle-kit studio --host=0.0.0.0 --port=4983
    environment:
      DATABASE_URL: postgres://reporting:${POSTGRES_PASSWORD}@db:5432/reporting
    ports:
      - "4983:4983"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reporting
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
