name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Lint, typecheck and test with the organisation's shared Node pipeline
  test:
    uses: acme/workflows/.github/workflows/node-ci.yml@main
    with:
      node-version: 20
    secrets: inherit

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@main
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@main
